[workspace]
# M0 status: only the dependency-free crates are workspace members, because the
# build sandbox could not download crates. Add "programs/*" back to `members`
# (and remove it from `exclude`) as soon as anchor-lang can be fetched.
members = ["crates/engine", "crates/journal-types"]
# tests-rs is its own workspace (own Cargo.lock/target), same pattern as the vault,
# so litesvm's dependency tree never touches this lockfile.
exclude = ["tests-rs", "programs/setl8-lev-trading"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
