[package]
name = "setl8-lev-journal-types"
version = "0.1.0"
edition = "2021"
publish = false
description = "Journal event, batch and price-proof types shared by the program, the evaluator and the verifier (DESIGN 8)."

[lib]
name = "journal_types"

[features]
# `native-sha2` provides `NativeSha256` (the `sha2` crate) for the evaluator, the verifier, WASM and tests.
# It is ON by default; the Solana program must depend on this crate with `default-features = false` and pass
# the `sol_sha256` syscall through the `Sha256` trait, so no hashing code is linked into the .so.
default = ["native-sha2"]
native-sha2 = ["dep:sha2"]

[dependencies]
sha2 = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"
