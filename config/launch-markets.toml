# config/launch-markets.toml: the human-editable input of tools/launch-config (P19 part B, decision 61).
#
# Edit this file, then:   cd tools/launch-config && cargo run --release -- generate     (writes config/launch.json and config/launch.md)
#                         cd tools/launch-config && cargo run --release -- verify       (re-derives both and checks every rule)
# Before a production deploy:                             cargo run --release -- verify --production   (fails while any PENDING flag remains)
#
# Every number that is a PLACEHOLDER is flagged `pending = true` (rule set v1: half-spreads and commissions, decision 14) or
# described as PLACEHOLDER-ADMIN-TUNABLE in launch.md (quantity step and minimum, max_notional_usd: either admin can change them
# at any time with update_market, decision 24). A rule set is immutable: the real numbers are a NEW rule set version.
# The measured numbers (prices, freezes, oracle statistics) come from the probe CSVs of 2026-10-16/11 (git-ignored raw data on
# the Mac); `launch-config probe` recomputes them and `launch-config verify --hl-csv ... --gmx-1min ... --gmx-samples ...` compares.

[meta]
format = "setl8-launch-markets"
version = 1

[rules]
# decision 57: max_age_secs = longest freeze + 25 %, rounded up to 5 s, never below 15 s
freeze_margin_pct = 25
max_age_round_secs = 5
max_age_floor_secs = 15
# decision 56: go-live rule for a Hyperliquid oracle market (bp of the book mid)
golive_median_bp = 6.0
golive_p95_bp = 12.0
# PLACEHOLDER-ADMIN-TUNABLE: quantity step = minimum = the smallest 1-2-5 quantity worth at least this many USD
order_notional_usd = 10
# PLACEHOLDER-ADMIN-TUNABLE: max_notional_usd = this account size x class leverage, rounded down to 1-2-5, within the ceilings.
# Decision 64 (P21): the basis is the BIGGEST tier ($200,000), so that tier can use its class leverage; the absolute ceilings below
# still bind. (P19 started at the 10K tier, which capped a $200,000 account far below its leverage; see launch.md.)
cap_basis_tier_usd = 200000
cap_ceiling_usd = 5000000
cap_ceiling_stock_usd = 500000

[ruleset]
version = 1
fee_bps = 40
tier_sizes_usd = [2500, 5000, 10000, 15000, 20000, 25000, 50000, 75000, 100000, 200000]
tier_costs_usd = [30, 55, 99, 145, 189, 235, 489, 689, 859, 1599]
reset_ladder_bps = [10000, 11500, 12000, 12750, 13000]
leverage_x = [50, 20, 20, 20, 10, 5, 5, 2]
holding_fee_e6 = [100, 200, 400, 200, 400, 400, 1000, 1600]

# Commission per side in e6 of notional (charged at open and at close), by class. PENDING: placeholders (decision 14).
