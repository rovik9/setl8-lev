[package]
name = "tests-rs"
version = "0.0.0"
edition = "2021"
publish = false
description = "Dev-only LiteSVM integration tests for setl8-lev-trading. Not an Anchor program."

# Standalone workspace: keeps litesvm out of the program's Cargo.lock (same pattern as the vault).
[workspace]

[dev-dependencies]
# The program crate is used only to build instructions and decode accounts; the program under test
# is the built localnet .so (target/test-deploy/), loaded into LiteSVM.
setl8-lev-trading = { path = "../programs/setl8-lev-trading", features = ["no-entrypoint", "localnet"] }
setl8-shared-interfaces = { git = "https://github.com/rovik9/setl8-turbo", tag = "v0.5.0" }
anchor-lang = "0.32.1"
base64 = "0.21"
anchor-spl = { version = "0.32.1", default-features = false, features = ["token"] }
sha2 = "0.10"
setl8-lev-engine = { path = "../crates/engine" }
setl8-lev-journal-types = { path = "../crates/journal-types" }
litesvm = "=0.7.0"
solana-keypair = "2"
solana-signer = "2"
solana-transaction = "2"
solana-message = "2"
solana-transaction-error = "2"
solana-account = "2"
solana-pubkey = "2"

[lints.clippy]
# litesvm's `FailedTransactionMetadata` is large; test helpers return it as is
result_large_err = "allow"
